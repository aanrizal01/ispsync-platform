# Local client definition for testing and default fallback
client localhost {
    ipaddr = 127.0.0.1
    proto = *
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

client docker_network {
    ipaddr = 0.0.0.0/0
    proto = *
    secret = $ENV{RADIUS_SECRET}
    require_message_authenticator = no
    nas_type = other
}
