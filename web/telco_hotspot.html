<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Access - {{.TenantName}}</title>
    <link rel="icon" type="image/svg+xml" href="{{.LogoURL}}" id="tab-favicon">
    <script>
      const fav = document.getElementById("tab-favicon");
      if (fav && fav.href.includes("_logo.svg")) {
        fav.href = fav.href.replace("_logo.svg", "_favicon.svg");
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .brand-bg { background-color: {{.BrandColor}}; }
        .brand-text { color: {{.BrandColor}}; }
        .brand-border { border-color: {{.BrandColor}}; }
        
        /* Tab Styles */
        .tab-btn { transition: all 0.2s; border-bottom: 2px solid transparent; }
        .tab-btn.active { border-bottom-color: {{.BrandColor}}; color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Header -->
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-xl overflow-hidden shadow-xl">
        <div class="brand-bg px-5 py-4 flex items-center justify-center">
            {{if .LogoURL}}
            <img src="{{.LogoURL}}" alt="Logo" class="h-8 w-auto brightness-0 invert">
            {{else}}
            <div class="font-black text-white text-xl tracking-wider">{{.TenantPrefix}}</div>
            {{end}}
        </div>

        <!-- Auth Form -->
        <div class="p-6 sm:p-8 bg-white">
            <h2 class="text-xl font-black text-slate-800 mb-1 text-center">Selamat Datang</h2>
            <p class="text-xs text-slate-500 mb-6 text-center">Silakan pilih metode masuk ke jaringan Wi-Fi.</p>
            
            <!-- Tabs -->
            <div class="flex border-b border-slate-200 mb-6">
                <button type="button" onclick="switchTab('voucher')" id="tab-voucher" class="tab-btn active w-1/2 pb-3 text-sm font-bold text-slate-400 hover:text-slate-700 uppercase tracking-wider mono">
                    VOUCHER
                </button>
                <button type="button" onclick="switchTab('member')" id="tab-member" class="tab-btn w-1/2 pb-3 text-sm font-bold text-slate-400 hover:text-slate-700 uppercase tracking-wider mono">
                    MEMBER
                </button>
            </div>

            <!-- Login Form -->
            <form action="{{.LoginLink}}" method="post" id="loginForm" onsubmit="return handlePreSubmit()" class="space-y-4">
                <input type="hidden" name="dst" value="{{.DestURL}}">
                <input type="hidden" name="popup" value="true">
                <input type="hidden" id="authMethod" value="voucher">
                
                <div id="field-username">
                    <label id="label-username" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 mono">Kode Voucher</label>
                    <input type="text" id="input-username" name="username" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg px-4 py-3 text-sm font-bold text-slate-800 mono outline-none transition" placeholder="ENTER_CODE" required>
                </div>
                
                <div id="field-password" class="hidden">
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5 mono">Password Member</label>
                    <input type="password" id="input-password" name="password" class="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-lg px-4 py-3 text-sm font-bold text-slate-800 mono outline-none transition" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full brand-bg hover:brightness-110 text-white font-black text-sm uppercase tracking-wider py-3.5 rounded-lg shadow-md transition mt-4 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    CONNECT TO NETWORK
                </button>
            </form>
        </div>
        
        <!-- Footer / Links -->
        <div class="p-5 bg-slate-50 border-t border-slate-200 flex flex-col gap-3">
            <a href="#" id="link-buy" class="flex items-center justify-center gap-2 px-5 py-3 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 bg-white hover:bg-slate-100 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                BELI VOUCHER ONLINE
            </a>
            
            <a href="/agent/login" class="flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg border border-transparent text-xs font-bold text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                PORTAL LOGIN AGEN
            </a>

            <div class="text-[10px] text-slate-400 mt-2 mono text-center font-medium">
                POWERED BY ISPSYNC
            </div>
        </div>
    </div>

    <script>
        function switchTab(method) {
            document.getElementById('authMethod').value = method;
            
            const btnVoucher = document.getElementById('tab-voucher');
            const btnMember = document.getElementById('tab-member');
            const labelUser = document.getElementById('label-username');
            const inputUser = document.getElementById('input-username');
            const fieldPass = document.getElementById('field-password');
            const inputPass = document.getElementById('input-password');

            if (method === 'voucher') {
                btnVoucher.classList.add('active');
                btnMember.classList.remove('active');
                
                labelUser.innerText = 'Kode Voucher';
                inputUser.placeholder = 'ENTER_CODE';
                
                fieldPass.classList.add('hidden');
                inputPass.required = false;
            } else {
                btnMember.classList.add('active');
                btnVoucher.classList.remove('active');
                
                labelUser.innerText = 'Username Member';
                inputUser.placeholder = 'ENTER_USER';
                
                fieldPass.classList.remove('hidden');
                inputPass.required = true;
            }
        }

        function handlePreSubmit() {
            const method = document.getElementById('authMethod').value;
            if (method === 'voucher') {
                const userVal = document.getElementById('input-username').value;
                document.getElementById('input-password').value = userVal;
            }
            return true;
        }

        try {
            const parts = window.location.host.split('.');
            let tenantSlug = '';
            if (parts.length >= 3 && window.location.host.includes('ispsync.id')) {
                tenantSlug = parts[1];
            }
            if (tenantSlug) {
                const url = 'https://wifi.' + tenantSlug + '.ispsync.id/hotspot/buy';
                document.getElementById('link-buy').href = url;
            } else {
                document.getElementById('link-buy').href = 'https://wifi.dev.ispsync.id/hotspot/buy';
            }
        } catch(e) {}
    </script>
</body>
</html>
