# ISP Billing & Network Access Management Platform
# Production Docker Compose
#
# Usage:
#   cp .env.production.example .env.production
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.production up -d --build

name: isp-billing-prod

services:
  # ──────────────────────────────────────────────
  # PostgreSQL 16
  # ──────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: isp-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-isp_billing}
      POSTGRES_USER: ${POSTGRES_USER:-isp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal_net
      - public_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isp_admin} -d ${POSTGRES_DB:-isp_billing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ──────────────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: isp-prod-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # FreeRADIUS 3.2 AAA
  # ──────────────────────────────────────────────
  freeradius:
    build:
      context: ../docker/freeradius
      dockerfile: Dockerfile
    container_name: isp-prod-freeradius
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-isp_billing}
      DB_USER: ${POSTGRES_USER:-isp_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RADIUS_SECRET: ${RADIUS_SECRET}
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "1814:1814/udp"
    networks:
      - internal_net
      - radius_net
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Go API Server (Distroless Production)
  # ──────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: production
    container_name: isp-prod-api
    restart: always
    environment:
      ENV: production
      SERVER_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-isp_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-isp_billing}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACCESS_TOKEN_TTL: 15m
      JWT_REFRESH_TOKEN_TTL: 168h
      ALLOWED_ORIGINS: https://${DOMAIN:-billing.yourisp.id}
      LOG_LEVEL: info
      LOG_FORMAT: json
      MIGRATIONS_PATH: /migrations
      APP_NAME: ${APP_NAME:-ISP Billing Platform}
      APP_BASE_URL: https://${DOMAIN:-billing.yourisp.id}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-production}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - ../keys:/app/keys:ro
    networks:
      - internal_net
      - public_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Go Background Worker (Auto-Invoicing & Overdue)
  # ──────────────────────────────────────────────
  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: production
    container_name: isp-prod-worker
    restart: always
    entrypoint: ["/worker"]
    environment:
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-isp_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-isp_billing}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOG_LEVEL: info
      LOG_FORMAT: json
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FONNTE_TOKEN: ${FONNTE_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    networks:
      - internal_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Next.js Web Frontend (Standalone Production)
  # ──────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: production
    container_name: isp-prod-web
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://${DOMAIN:-billing.yourisp.id}/api/v1
      PORT: 3000
    volumes:
      - ../apps/web/data:/app/data
    networks:
      - public_net
    depends_on:
      - api

  # ──────────────────────────────────────────────
  # Caddy Reverse Proxy & SSL Automation
  # ──────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: isp-prod-caddy
    restart: always
    environment:
      DOMAIN: ${DOMAIN:-billing.yourisp.id}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
      - caddy_prod_logs:/var/log/caddy
    networks:
      - public_net
    depends_on:
      - api
      - web

# ──────────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────────
volumes:
  postgres_prod_data:
    name: isp_prod_postgres_data
  redis_prod_data:
    name: isp_prod_redis_data
  caddy_prod_data:
    name: isp_prod_caddy_data
  caddy_prod_config:
    name: isp_prod_caddy_config
  caddy_prod_logs:
    name: isp_prod_caddy_logs

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  internal_net:
    name: isp_prod_internal
    internal: true # Terisolasi total dari internet luar
  public_net:
    name: isp_prod_public
  radius_net:
    name: isp_prod_radius
