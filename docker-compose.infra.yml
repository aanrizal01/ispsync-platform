services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gogigabill-postgres
    restart: always
    environment:
      POSTGRES_DB: isp_billing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: G0gigaBillPostgres2026!
    volumes:
      - gogigabill_pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d isp_billing']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gogigabill-redis
    restart: always
    command: ['redis-server', '--requirepass', 'G0gigaBillRedis2026!', '--appendonly', 'yes']
    volumes:
      - gogigabill_redisdata:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'G0gigaBillRedis2026!', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  freeradius:
    image: gogigabill-freeradius:latest
    container_name: gogigabill-freeradius
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: isp_billing
      DB_USER: postgres
      DB_PASSWORD: G0gigaBillPostgres2026!
      RADIUS_SECRET: ITzY02nmpkgxiZfR
    ports:
      - '1812:1812/udp'
      - '1813:1813/udp'
      - '3799:3799/udp'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gogigabill_pgdata:
  gogigabill_redisdata:
